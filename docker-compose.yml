# Local PostgreSQL for development and the integration tests.
# The application creates its tables on startup (Database:CreateSchemaIfMissing).
services:
  postgres:
    image: postgres:17
    container_name: rechnungen-db
    environment:
      POSTGRES_DB: rechnungen
      POSTGRES_USER: rechnungen
      POSTGRES_PASSWORD: rechnungen_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rechnungen -d rechnungen"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
